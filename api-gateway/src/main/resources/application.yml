server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthenticationFilter
            - StripPrefix=1

        - id: film-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/films/**
          filters:
            - JwtAuthenticationFilter
            - StripPrefix=1

        - id: review-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/reviews/**
          filters:
            - JwtAuthenticationFilter
            - StripPrefix=1

        - id: parsing-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/parse/**
          filters:
            - JwtAuthenticationFilter
            - StripPrefix=1

jwt:
  secret: mySecretKeyForJWTTokenGeneration2024VeryLong
  expiration: 86400000

logging:
  level:
    com.moviereview: DEBUG