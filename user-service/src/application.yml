server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret: mySecretKeyForJWTTokenGeneration2024VeryLong
  expiration: 86400000

logging:
  level:
    com.moviereview: DEBUG